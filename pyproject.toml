[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callimachus-archive"
version = "0.1.0"
description = "Archive Wispr Flow meeting notes and transcripts locally or through Google Drive API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
  "python-dotenv>=1.1,<2",
  "filelock>=3.19,<4",
]

[project.scripts]
callimachus = "callimachus.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/callimachus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
